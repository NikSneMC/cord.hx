name: 🐛 Bug report
description: Report a problem or unexpected behaviour
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: "Checklist"
      options:
        - label: "I have looked through [existing issues](https://github.com/NikSneMC/cord.hx/issues)"
          required: true
        - label: "I am using a Helix build with Steel plugin support"
          required: true
  - type: textarea
    attributes:
      label: "Description"
      description: "Explain the issue you are facing. You may include any relevant logs, screenshots, etc. For subtle bugs, run Helix with `CORD_LOG_FILE=/tmp/cord.log CORD_LOG_LEVEL=trace` and attach the log."
      value: |
        <!-- describe the problem -->



        <details>
        <summary>Logs (optional)</summary>

        <!-- paste logs inside this block -->

        </details>
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Debug information"
      description: "Output of `:cord-debug-copy`"
      render: markdown
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Minimal configuration"
      description: "Minimal `init.scm` (or nhx configuration) that reproduces the issue"
      value: |
        ```scheme
        (require "cord/cord.scm")
        (cord-configure! (hash))
        ```
    validations:
      required: false
