[package]
authors = ["vyfor", "NikSneMC"]
categories = ["command-line-utilities"]
description = "Discord Rich Presence for Helix, written in Steel with a Rust core"
edition = "2024"
keywords = ["discord-rpc", "discord", "rich-presence", "helix", "plugin"]
license = "Apache-2.0"
name = "cord-hx"
repository = "https://github.com/NikSneMC/cord.hx"
homepage = "https://github.com/NikSneMC/cord.hx"
publish = false
version = "1.0.0"
rust-version = "1.89.0"

# The server executable. Spawned (and shared) by every editor instance.
[[bin]]
name = "cord"
path = "src/main.rs"

# The steel dylib (`libcord_hx`). Built and installed by `forge`.
[lib]
name = "cord_hx"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11.3"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
rmpv = "1"
serde_json = "1"
steel-core = { version = "=0.8.2", features = ["dylibs", "sync"] }

[profile.release]
incremental = true
